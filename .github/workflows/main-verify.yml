name: "Verify main and bump patch"

permissions:
  contents: write

concurrency:
  group: main-verify-main
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"

env:
  GO_VERSION: "1.26"

jobs:
  gate:
    name: "Resolve generator versions"
    runs-on: ubuntu-latest
    outputs:
      generator-versions: ${{ steps.versions.outputs.generator-versions }}
      gometagen-version: ${{ steps.versions.outputs.gometagen-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve generator versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_version() {
            go list -m -f '{{.Version}}' "$1@latest"
          }

          versions_file="${RUNNER_TEMP}/generator-versions.env"
          {
            echo "GOMETAGEN_VERSION=$(resolve_version github.com/amazing-generators/gometagen)"
            echo "GOCONFGEN_VERSION=$(resolve_version github.com/amazing-generators/goconfgen)"
            echo "GODEPSGEN_VERSION=$(resolve_version github.com/amazing-generators/godepsgen)"
          } > "$versions_file"

          set -a
          . "$versions_file"
          set +a

          {
            echo "gometagen-version=${GOMETAGEN_VERSION}"
            echo "generator-versions<<GENERATOR_VERSIONS"
            cat "$versions_file"
            echo "GENERATOR_VERSIONS"
          } >> "$GITHUB_OUTPUT"

  prepare:
    name: "Prepare source"
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          check-clean: "true"
          generator-versions: ${{ needs.gate.outputs.generator-versions }}

      - name: Upload prepared source
        uses: actions/upload-artifact@v7
        with:
          name: prepared-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .
            !.git
            !.git/**

  test:
    name: "Test ${{ matrix.os }}"
    needs: [ gate, prepare ]
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: "true"

  bump:
    name: "Bump patch version"
    needs: [ gate, prepare, test ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/github-setup-user

      - name: Bump and push patch version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          current_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "main moved from ${GITHUB_SHA} to ${current_sha}" >&2
            exit 1
          fi

          gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ needs.gate.outputs.gometagen-version }}"
          new_version=$(go run "$gometagen" version patch -source _run/values.yml)
          echo "New version: ${new_version}"

          git add _run/values.yml
          git diff --cached --quiet && {
            echo "Patch version bump is empty" >&2
            exit 1
          }
          git commit -m "patch(${new_version}): auto-bump after verification"
          git push origin HEAD:main \
            --force-with-lease=refs/heads/main:${GITHUB_SHA}

      - name: Clean up source artifact
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: prepared-source
          failOnError: false
