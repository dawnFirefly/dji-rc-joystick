name: "Release"

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  gate:
    name: "Select source"
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.versions.outputs.base-sha }}
      generator-versions: ${{ steps.versions.outputs.generator-versions }}
      gometagen-version: ${{ steps.versions.outputs.gometagen-version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Select source and resolve generator versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          resolve_version() {
            go list -m -f '{{.Version}}' "$1@latest"
          }

          versions_file="${RUNNER_TEMP}/generator-versions.env"
          {
            echo "GOMETAGEN_VERSION=$(resolve_version github.com/amazing-generators/gometagen)"
            echo "GOCONFGEN_VERSION=$(resolve_version github.com/amazing-generators/goconfgen)"
            echo "GODEPSGEN_VERSION=$(resolve_version github.com/amazing-generators/godepsgen)"
          } > "$versions_file"

          set -a
          . "$versions_file"
          set +a

          {
            echo "gometagen-version=${GOMETAGEN_VERSION}"
            echo "generator-versions<<GENERATOR_VERSIONS"
            cat "$versions_file"
            echo "GENERATOR_VERSIONS"
          } >> "$GITHUB_OUTPUT"

  stage:
    name: "Stage release source"
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.build-env.outputs.version }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          fetch-depth: 0

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Bump minor version locally
        shell: bash
        run: |
          set -Eeuo pipefail
          gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ needs.gate.outputs.gometagen-version }}"
          new_version=$(go run "$gometagen" version minor -source _run/values.yml)
          echo "Release version: ${new_version}"

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          generator-versions: ${{ needs.gate.outputs.generator-versions }}

      - id: build-env
        uses: ./.github/actions/generate-build-env
        with:
          gometagen-version: ${{ needs.gate.outputs.gometagen-version }}

      - name: Upload staged source
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .
            !.git
            !.git/**

  test:
    name: "Test release on ${{ matrix.os }}"
    needs: [ gate, stage ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          fetch-depth: 1

      - name: Download staged source
        uses: actions/download-artifact@v8
        with:
          name: release-source
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests

  build:
    name: "Build CLI binaries"
    needs: [ gate, stage, test ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          fetch-depth: 1

      - name: Download staged source
        uses: actions/download-artifact@v8
        with:
          name: release-source
          path: .

      - name: Load build environment
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cross-compile CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          targets=(
            linux/amd64
            linux/arm64
            linux/386
            windows/amd64
            windows/arm64
            darwin/amd64
            darwin/arm64
          )

          for target in "${targets[@]}"; do
            IFS=/ read -r goos goarch <<< "$target"
            suffix=""
            if [ "$goos" = "windows" ]; then
              suffix=".exe"
            fi

            output="dist/cli-${BUILD_NAME}-${goos}-${goarch}${suffix}"
            echo "Building ${output}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build \
                -trimpath \
                -ldflags="-s -w" \
                -o "$output" \
                ./cli
          done

          ls -lh dist

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          if-no-files-found: error
          retention-days: 1
          path: dist/

  release:
    name: "Publish release"
    needs: [ gate, stage, test, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.base-sha }}
          fetch-depth: 0

      - name: Download staged source
        uses: actions/download-artifact@v8
        with:
          name: release-source
          path: .

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/github-setup-user

      - name: Push release version
        shell: bash
        env:
          BUILD_VER: ${{ needs.stage.outputs.build-version }}
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags
          current_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$current_sha" != "$BASE_SHA" ]; then
            echo "main moved from ${BASE_SHA} to ${current_sha}" >&2
            exit 1
          fi

          git add _run/values.yml
          git diff --cached --quiet && {
            echo "Release version bump is empty" >&2
            exit 1
          }
          git commit -m "minor(${BUILD_VER}): release"
          git push origin HEAD:main \
            --force-with-lease=refs/heads/main:${BASE_SHA}

      - name: Create stripped library tag
        shell: bash
        env:
          BUILD_VER: ${{ needs.stage.outputs.build-version }}
        run: |
          set -Eeuo pipefail
          original_sha=$(git rev-parse HEAD)

          git add -f target go.sum

          remove_paths=()
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/*)
                remove_paths+=("$path")
                continue
                ;;
              mod/*|target/*|go.mod|go.sum|settings.yml|*.md)
                continue
                ;;
            esac

            base_name=${path##*/}
            case "$base_name" in
              LICENSE*|NOTICE*|COPYING*)
                continue
                ;;
            esac

            remove_paths+=("$path")
          done < <(git ls-files -z)

          if [ "${#remove_paths[@]}" -gt 0 ]; then
            git rm -r --cached --ignore-unmatch -- "${remove_paths[@]}"
          fi

          git commit -m "release(${BUILD_VER}): publish library source"
          git tag -a "$BUILD_VER" -m "Release ${BUILD_VER}"

          verify_dir="${RUNNER_TEMP}/release-source"
          mkdir -p "$verify_dir"
          git archive "$BUILD_VER" | tar -x -C "$verify_dir"
          (
            cd "$verify_dir"
            CGO_ENABLED=0 go test ./...
          )

          git push origin "$BUILD_VER"
          git reset --hard "$original_sha"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.stage.outputs.build-version }}
          name: ${{ needs.stage.outputs.build-version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up release artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            release-source
            release-binaries
          failOnError: false
