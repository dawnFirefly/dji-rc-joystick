name: "Tests and benchmarks"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"

env:
  GO_VERSION: "1.26"

jobs:
  prepare:
    name: "Prepare source"
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          check-clean: "true"

      - name: Upload prepared source
        uses: actions/upload-artifact@v7
        with:
          name: prepared-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .
            !.git
            !.git/**

  test:
    name: "Test ${{ matrix.os }}"
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download prepared source
        uses: actions/download-artifact@v8
        with:
          name: prepared-source
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: ${{ contains(github.event.pull_request.labels.*.name, 'bench') && 'true' || 'false' }}
