name: "Read build environment"
description: "Read the application name and version from the build manifest"

inputs:
  gometagen-version:
    description: "Resolved gometagen version"
    required: true

outputs:
  name:
    description: "Application name"
    value: ${{ steps.manifest.outputs.name }}
  version:
    description: "Application version"
    value: ${{ steps.manifest.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Read build manifest
      id: manifest
      shell: bash
      run: |
        set -Eeuo pipefail
        gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ inputs.gometagen-version }}"
        build_name=$(go run "$gometagen" manifest get -source _run/values.yml -field name)
        build_version=$(go run "$gometagen" version print -source _run/values.yml)

        if [[ ! "$build_name" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
          echo "Invalid build name: ${build_name}" >&2
          exit 1
        fi
        if [[ ! "$build_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid build version: ${build_version}" >&2
          exit 1
        fi

        {
          echo "BUILD_NAME=${build_name}"
          echo "BUILD_VER=${build_version}"
        } > build_env.txt

        {
          echo "name=${build_name}"
          echo "version=${build_version}"
        } >> "$GITHUB_OUTPUT"

        echo "Build version: ${build_version}"
