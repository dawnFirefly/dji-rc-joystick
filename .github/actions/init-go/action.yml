name: "Set up Go with cache"
description: "Set up Go and configure build and module caches"

inputs:
  go-version:
    description: "Deprecated compatibility input; go.mod is the source of truth"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Go from go.mod
      uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod

    - name: Read Go cache paths
      id: go-env
      shell: bash
      run: |
        set -Eeuo pipefail
        {
          echo "gocache=$(go env GOCACHE)"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "goversion=$(go env GOVERSION)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.go-env.outputs.gomodcache }}
        key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.work', '**/go.mod', '**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-${{ runner.arch }}-
          gomod-${{ runner.os }}-

    - name: Restore Go build cache
      if: runner.os != 'macOS'
      uses: actions/cache@v4
      with:
        path: ${{ steps.go-env.outputs.gocache }}
        key: gocache-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.goversion }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          gocache-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.goversion }}-
          gocache-${{ runner.os }}-${{ runner.arch }}-
