name: "Run tests and benchmarks"
description: "Run the root and CLI module test suites and optional benchmarks"

inputs:
  run-benchmarks:
    description: "Run benchmarks after tests"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run race tests
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        for module_dir in . cli; do
          echo "Testing ${module_dir}"
          CGO_ENABLED=1 go -C "$module_dir" test -race -v ./...
        done

    - name: Run Windows tests
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        for module_dir in . cli; do
          echo "Testing ${module_dir}"
          CGO_ENABLED=0 go -C "$module_dir" test -v ./...
        done

    - name: Run benchmarks
      if: inputs.run-benchmarks == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        for module_dir in . cli; do
          echo "Benchmarking ${module_dir}"
          CGO_ENABLED=1 go -C "$module_dir" test \
            -bench=. \
            -run=NONE \
            -benchmem \
            -v \
            ./...
        done

    - name: Run Windows benchmarks
      if: inputs.run-benchmarks == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        for module_dir in . cli; do
          echo "Benchmarking ${module_dir}"
          CGO_ENABLED=0 go -C "$module_dir" test \
            -bench=. \
            -run=NONE \
            -benchmem \
            -v \
            ./...
        done
